<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Enterprise SaaS Crash Engine & Predictor Suite</title>
    <link rel="icon" type="image/png" href="/assets/ico/favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & ReactDOM 18 UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131b2e;
            --accent-red: #e50914;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffb703;
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(229, 9, 20, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        /* Navigation Button Styles */
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            color: #f8fafc;
            background: rgba(229, 9, 20, 0.1);
            border-color: rgba(229, 9, 20, 0.2);
        }

        .nav-btn.active {
            color: #ff4757;
            background: rgba(229, 9, 20, 0.18);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.25);
        }

        .admin-tab-btn {
            background: #0a0d14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .admin-tab-btn:hover {
            color: #fff;
            border-color: rgba(229, 9, 20, 0.3);
        }

        .admin-tab-btn.active {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.3), rgba(255, 71, 87, 0.2));
            border-color: #e50914;
            color: #fff;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
        }

        .feature-card {
            background: #121622;
            border: 1px solid rgba(229, 9, 20, 0.15);
            border-radius: 18px;
            padding: 1.8rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .feature-card:hover {
            border-color: rgba(229, 9, 20, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 9, 20, 0.15);
        }

        /* Emergency Button Pulsing Animation */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(229, 9, 20, 0.9); transform: scale(1.02); }
            100% { box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); transform: scale(1); }
        }

        .emergency-btn-pulse {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="react-root"></div>
    <script src="/js/react-app.js"></script>
</body>
</html>
